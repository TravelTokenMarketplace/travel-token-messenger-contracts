name: CI (UI)

on:
    pull_request:
        paths:
            - "ui/**"
            - "abi/**"
            - "ignition/deployments/**"
            - ".github/workflows/ci-ui.yaml"

jobs:
    ui:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ui

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install UI dependencies
              run: yarn install --frozen-lockfile

            # generated/ is git-ignored; tests and build import it, so produce it first.
            - name: Generate contract data
              run: yarn sync

            - name: Test
              run: yarn test

            - name: Build
              run: yarn build
