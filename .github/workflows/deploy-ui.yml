name: Deploy UI

on:
    push:
        branches: [dev]
        paths:
            - "ui/**"
            - "abi/**"
            - "ignition/deployments/**"
            - ".github/workflows/deploy-ui.yml"
    workflow_dispatch:

# Default to least privilege; the deploy job widens these for Pages/OIDC.
permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Install UI deps
              working-directory: ui
              run: yarn install --frozen-lockfile
            - name: Build UI
              working-directory: ui
              run: yarn build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ui/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        # Pages publishing needs write + OIDC token; scope it to this job only.
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
